<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Apps - Nick Neo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 60px 40px;
            max-width: 600px;
            width: 100%;
            text-align: center;
        }

        h1 {
            color: #5D5CDE;
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #666;
            font-size: 1.1em;
            margin-bottom: 40px;
        }

        .apps-grid {
            display: grid;
            gap: 20px;
            margin-top: 40px;
        }

        .app-card {
            background: linear-gradient(135deg, #5D5CDE 0%, #764ba2 100%);
            padding: 30px;
            border-radius: 15px;
            text-decoration: none;
            color: white;
            transition: transform 0.3s, box-shadow 0.3s;
            display: block;
        }

        .app-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(93, 92, 222, 0.4);
        }

        .app-card h2 {
            font-size: 1.5em;
            margin-bottom: 10px;
        }

        .app-card p {
            opacity: 0.9;
            line-height: 1.6;
        }

        .footer {
            margin-top: 40px;
            color: #999;
            font-size: 0.9em;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Welcome</h1>
        <p class="subtitle">Explore my web applications</p>

        <div class="apps-grid">
            <a href="/natural-remedy-guide/" class="app-card">
                <h2>🌿 Natural Remedy Guide</h2>
                <p>Evidence-based information on 145+ natural supplements, vitamins, minerals, and herbs</p>
            </a>

            <!-- Add more apps here in the future -->
            <!-- 
            <a href="/fitness-tracker/" class="app-card">
                <h2>💪 Fitness Tracker</h2>
                <p>Track your workouts and progress</p>
            </a>
            -->
        </div>

        <div class="footer">
            <p>&copy; 2025 Nick Neo | Built with ❤️</p>
        </div>
    </div>
</body>
</html>
